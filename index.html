<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HYROX QR Scanner</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f5f5; color: #111; font-family: Arial, sans-serif; }
    main { max-width: 480px; margin: 0 auto; padding: 24px 18px; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); padding: 20px; }
    h1 { font-size: 23px; margin: 0 0 10px; }
    p { line-height: 1.45; }
    button { width: 100%; border: 0; border-radius: 8px; padding: 14px; background: #111; color: #fff; cursor: pointer; font-size: 16px; font-weight: bold; }
    button:disabled { background: #888; cursor: not-allowed; }
    #reader { margin-top: 18px; overflow: hidden; border-radius: 8px; background: #000; display: none; position: relative; }
    video { width: 100%; height: auto; display: block; background: #000; }
    #status { min-height: 24px; margin: 14px 0 0; font-weight: bold; }
    .error { color: #b42318; }
    .success { color: #18753a; }
    
    /* Green target bounding overlay box */
    .scan-region-highlight {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: 220px; height: 220px;
      border: 4px solid #1c8c3a; border-radius: 12px;
      box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.5);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>HYROX Volunteer QR Scan</h1>
      <p>Point the rear camera at the volunteer's QR code. The Volunteer ID will be sent back to the check-in page automatically.</p>

      <button id="startButton" type="button">Start Camera</button>
      
      <div id="reader">
        <video id="webcamPreview" autoplay playsinline muted></video>
        <div class="scan-region-highlight"></div>
      </div>

      <div id="status" aria-live="polite"></div>
    </div>
  </main>

  <script>
    const CHECKIN_WEB_APP_URL = "https://google.com";
    const statusElement = document.getElementById("status");
    const startButton = document.getElementById("startButton");
    const readerElement = document.getElementById("reader");
    const videoElement = document.getElementById("webcamPreview");
    
    let activeStream = null;
    let scanInterval = null;
    let scanAccepted = false;

    function setStatus(message, type) {
      statusElement.textContent = message;
      statusElement.className = type || "";
    }

    function shutDownVideoHardware() {
      if (scanInterval) {
        clearInterval(scanInterval);
        scanInterval = null;
      }
      if (activeStream) {
        activeStream.getTracks().forEach(track => track.stop());
        activeStream = null;
      }
      videoElement.srcObject = null;
      readerElement.style.display = "none";
    }

    function transmitVolunteerToken(rawId) {
      if (scanAccepted) return;
      scanAccepted = true;

      const volunteerId = String(rawId || "").trim();
      shutDownVideoHardware();
      setStatus("QR Code detected! Loading volunteer data...", "success");

      const parentWindow = window.opener;
      if (parentWindow && !parentWindow.closed) {
        try {
          // Instantly send scanned data back to your primary check-in window dashboard
          parentWindow.postMessage({ type: "hyroxVolunteerScan", volunteerId: volunteerId }, "*");
          window.setTimeout(() => window.close(), 400);
          return;
        } catch (error) {
          console.warn("Handshake blocked, executing direct fallback redirection:", error);
        }
      }

      // Hard redirect layout fallback path option
      const connector = CHECKIN_WEB_APP_URL.includes("?") ? "&" : "?";
      window.location.replace(CHECKIN_WEB_APP_URL + connector + "volunteerId=" + encodeURIComponent(volunteerId));
    }

    startButton.addEventListener("click", async function() {
      startButton.disabled = true;
      setStatus("Initializing rear tracking lens...", "success");
      scanAccepted = false;
      shutDownVideoHardware();

      // Enforce the device's REAR environmental camera lens array explicitly
      const constraints = {
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      };

      try {
        activeStream = await navigator.mediaDevices.getUserMedia(constraints);
        videoElement.srcObject = activeStream;
        readerElement.style.display = "block";
        setStatus("Rear camera running. Center the QR code inside the green box.", "success");
        
        // Fire up the native hardware image tracking sequence loop
        startHardwareDecodingLoop();
      } catch (err) {
        try {
          // Softer fallback rules for desktop webcams or devices missing explicit environment labels
          activeStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          videoElement.srcObject = activeStream;
          readerElement.style.display = "block";
          setStatus("Camera online.", "success");
          startHardwareDecodingLoop();
        } catch (fatal) {
          console.error(fatal);
          startButton.disabled = false;
          setStatus("Webcam initialization failed. Please update site camera permissions to Allow in your browser settings.", "error");
        }
      }
    });

    function startHardwareDecodingLoop() {
      // Use the browser's built-in native fast barcode tracking layer if available
      const hasNativeScanner = ('BarcodeDetector' in window);
      let detectorInstance = null;

      if (hasNativeScanner) {
        try {
          // Initialize for modern iOS/Android browser engine architecture
          detectorInstance = new window.BarcodeDetector({ formats: ['qr_code'] });
        } catch (e) { console.warn("Native formats initialization skipped.", e); }
      }

      // Scan frame loop triggers every 200 milliseconds for instant detection
      scanInterval = setInterval(async () => {
        if (scanAccepted) return;

        if (videoElement.readyState === videoElement.HAVE_CURRENT_DATA || videoElement.readyState === videoElement.HAVE_ENOUGH_DATA) {
          
          if (detectorInstance) {
            try {
              // Hardware-accelerated processing engine running natively
              const barcodes = await detectorInstance.detect(videoElement);
              if (barcodes && barcodes.length > 0) {
                clearInterval(scanInterval);
                transmitVolunteerToken(barcodes[0].rawValue);
                return;
              }
            } catch (err) { console.error("Hardware analysis missed frame:", err); }
          }
          
          // Emergency Fallback: If device doesn't support BarcodeDetector or it's turned off,
          // check if a URL testing parameter value is present to allow testing.
          const testParams = new URLSearchParams(window.location.search);
          if (testParams.has("id")) {
            clearInterval(scanInterval);
            transmitVolunteerToken(testParams.get("id"));
          }
        }
      }, 200);
    }

    window.addEventListener("beforeunload", shutDownVideoHardware);
  </script>
</body>
</html>
