<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>HYROX QR Scanner</title>

  <!-- jsQR -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f5f5;
      color: #111;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 18px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      padding: 20px;
    }

    h1 {
      font-size: 23px;
      margin: 0 0 10px;
    }

    p {
      line-height: 1.45;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 14px;
      background: #111;
      color: #fff;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    button:disabled {
      background: #888;
      cursor: not-allowed;
    }

    #reader {
      margin-top: 18px;
      overflow: hidden;
      border-radius: 8px;
      background: #000;
      display: none;
      position: relative;
    }

    video {
      width: 100%;
      height: auto;
      display: block;
      background: #000;
    }

    #status {
      min-height: 24px;
      margin: 14px 0 0;
      font-weight: bold;
    }

    .error {
      color: #b42318;
    }

    .success {
      color: #18753a;
    }

    .scan-region-highlight {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 220px;
      height: 220px;
      border: 4px solid #1c8c3a;
      border-radius: 12px;
      box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.5);
      pointer-events: none;
    }

    #scanCanvas {
      display: none;
    }
  </style>
</head>

<body>

  <main>

    <div class="card">

      <h1>HYROX Volunteer QR Scan</h1>

      <p>
        Point the rear camera at the volunteer's QR code.
        The Volunteer ID will be sent back to the check-in
        page automatically.
      </p>

      <button id="startButton" type="button">
        Start Camera
      </button>

      <div id="reader">

        <video
          id="webcamPreview"
          autoplay
          playsinline
          muted>
        </video>

        <div class="scan-region-highlight"></div>

      </div>

      <canvas id="scanCanvas"></canvas>

      <div id="status" aria-live="polite"></div>

    </div>

  </main>


  <script>

    // ============================================================
    // CONFIGURATION
    // ============================================================

    const STORAGE_RETURN_URL =
      "hyroxScannerReturnUrl";

    const STORAGE_EVENT_DAY =
      "hyroxScannerEventDay";

    const STORAGE_VOLUNTEER_ID =
      "hyroxScannerVolunteerId";


    // ============================================================
    // DOM ELEMENTS
    // ============================================================

    const statusElement =
      document.getElementById("status");

    const startButton =
      document.getElementById("startButton");

    const readerElement =
      document.getElementById("reader");

    const videoElement =
      document.getElementById("webcamPreview");

    const canvasElement =
      document.getElementById("scanCanvas");

    const canvasContext =
      canvasElement.getContext("2d", {
        willReadFrequently: true
      });


    // ============================================================
    // STATE
    // ============================================================

    let activeStream = null;

    let scanInterval = null;

    let scanAccepted = false;

    let nativeDetector = null;


    // ============================================================
    // READ URL PARAMETERS
    // ============================================================

    const urlParams =
      new URLSearchParams(
        window.location.search
      );


    // ============================================================
    // RECOVER RETURN INFORMATION
    // ============================================================

    function getSavedReturnUrl() {

      const currentReturnUrl =
        urlParams.get("returnUrl");

      if (currentReturnUrl) {

        try {

          const decoded =
            decodeURIComponent(
              currentReturnUrl
            );

          sessionStorage.setItem(
            STORAGE_RETURN_URL,
            decoded
          );

          localStorage.setItem(
            STORAGE_RETURN_URL,
            decoded
          );

          return decoded;

        } catch (error) {

          console.warn(
            "Unable to decode returnUrl.",
            error
          );

        }

      }


      const sessionReturnUrl =
        sessionStorage.getItem(
          STORAGE_RETURN_URL
        );

      if (sessionReturnUrl) {

        return sessionReturnUrl;

      }


      const localReturnUrl =
        localStorage.getItem(
          STORAGE_RETURN_URL
        );

      if (localReturnUrl) {

        return localReturnUrl;

      }


      return "";

    }


    function getSavedEventDay() {

      const currentEventDay =
        urlParams.get("eventDay");

      if (currentEventDay) {

        try {

          const decoded =
            decodeURIComponent(
              currentEventDay
            );

          sessionStorage.setItem(
            STORAGE_EVENT_DAY,
            decoded
          );

          localStorage.setItem(
            STORAGE_EVENT_DAY,
            decoded
          );

          return decoded;

        } catch (error) {

          console.warn(
            "Unable to decode eventDay.",
            error
          );

        }

      }


      const sessionEventDay =
        sessionStorage.getItem(
          STORAGE_EVENT_DAY
        );

      if (sessionEventDay) {

        return sessionEventDay;

      }


      const localEventDay =
        localStorage.getItem(
          STORAGE_EVENT_DAY
        );

      if (localEventDay) {

        return localEventDay;

      }


      return "";

    }


    // ============================================================
    // PRESERVE SCANNER CONTEXT IMMEDIATELY
    // ============================================================

    let returnUrl =
      getSavedReturnUrl();

    let selectedEventDay =
      getSavedEventDay();


    console.log(
      "Scanner return URL:",
      returnUrl
    );

    console.log(
      "Scanner event day:",
      selectedEventDay
    );


    // ============================================================
    // STATUS
    // ============================================================

    function setStatus(message, type) {

      statusElement.textContent =
        message;

      statusElement.className =
        type || "";

    }


    // ============================================================
    // STOP CAMERA
    // ============================================================

    function shutDownVideoHardware() {

      if (scanInterval) {

        clearInterval(scanInterval);

        scanInterval = null;

      }


      if (activeStream) {

        activeStream
          .getTracks()
          .forEach(
            function(track) {
              track.stop();
            }
          );

        activeStream = null;

      }


      videoElement.srcObject =
        null;

      readerElement.style.display =
        "none";

    }


    // ============================================================
    // BUILD FINAL RETURN URL
    // ============================================================

    function buildReturnUrl(volunteerId) {

      let destination =
        returnUrl;


      if (!destination) {

        destination =
          sessionStorage.getItem(
            STORAGE_RETURN_URL
          ) || "";

      }


      if (!destination) {

        destination =
          localStorage.getItem(
            STORAGE_RETURN_URL
          ) || "";

      }


      if (!destination) {

        console.error(
          "No return URL available."
        );

        return "";

      }


      try {

        const destinationUrl =
          new URL(destination);


        // --------------------------------------------------------
        // Add Volunteer ID
        // --------------------------------------------------------

        destinationUrl.searchParams.set(
          "volunteerId",
          volunteerId
        );


        // --------------------------------------------------------
        // Add Event Day
        // --------------------------------------------------------

        if (selectedEventDay) {

          destinationUrl.searchParams.set(
            "eventDay",
            selectedEventDay
          );

        }


        return destinationUrl.toString();

      } catch (error) {

        console.error(
          "Unable to build return URL.",
          error
        );

        return "";

      }

    }


    // ============================================================
    // SEND VOLUNTEER ID
    // ============================================================

    function transmitVolunteerToken(rawId) {

      if (scanAccepted) {

        return;

      }


      const volunteerId =
        String(
          rawId || ""
        ).trim();


      if (!volunteerId) {

        return;

      }


      scanAccepted = true;


      // Save scanned ID in case the browser
      // performs another unexpected navigation.

      try {

        sessionStorage.setItem(
          STORAGE_VOLUNTEER_ID,
          volunteerId
        );

        localStorage.setItem(
          STORAGE_VOLUNTEER_ID,
          volunteerId
        );

      } catch (error) {

        console.warn(
          "Unable to save scanned ID.",
          error
        );

      }


      shutDownVideoHardware();


      setStatus(
        "QR Code detected! Returning to check-in...",
        "success"
      );


      // ==========================================================
      // METHOD 1
      // Existing desktop / Android flow
      // ==========================================================

      if (
        window.opener &&
        !window.opener.closed
      ) {

        try {

          window.opener.postMessage(
            {
              type:
                "hyroxVolunteerScan",

              volunteerId:
                volunteerId,

              eventDay:
                selectedEventDay
            },
            "*"
          );


          console.log(
            "Volunteer ID sent to check-in window:",
            volunteerId
          );


          setTimeout(
            function() {

              try {

                window.close();

              } catch (error) {

                console.warn(
                  "Unable to close scanner window.",
                  error
                );

              }

            },
            300
          );


          return;

        } catch (error) {

          console.warn(
            "postMessage failed. Using redirect fallback.",
            error
          );

        }

      }


      // ==========================================================
      // METHOD 2
      // iPhone / lost opener fallback
      // ==========================================================

      const destination =
        buildReturnUrl(
          volunteerId
        );


      if (destination) {

        console.log(
          "Redirecting to check-in page:",
          destination
        );


        window.location.replace(
          destination
        );


        return;

      }


      // ==========================================================
      // NO RETURN URL
      // ==========================================================

      scanAccepted = false;


      setStatus(
        "Unable to find the check-in page. Please go back and open Scan Volunteer QR again.",
        "error"
      );

    }


    // ============================================================
    // START CAMERA
    // ============================================================

    startButton.addEventListener(
      "click",
      async function() {

        startButton.disabled =
          true;


        setStatus(
          "Initializing rear camera...",
          "success"
        );


        scanAccepted =
          false;


        shutDownVideoHardware();


        const constraints = {

          video: {

            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }

          },

          audio: false

        };


        try {

          activeStream =
            await navigator.mediaDevices.getUserMedia(
              constraints
            );


          videoElement.srcObject =
            activeStream;


          readerElement.style.display =
            "block";


          setStatus(
            "Rear camera running. Center the QR code inside the green box.",
            "success"
          );


          await videoElement.play();


          initializeQrDecoder();


        } catch (error) {

          console.error(
            "Rear camera failed:",
            error
          );


          // ------------------------------------------------------
          // Fallback camera request
          // ------------------------------------------------------

          try {

            activeStream =
              await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: false
              });


            videoElement.srcObject =
              activeStream;


            readerElement.style.display =
              "block";


            setStatus(
              "Camera online. Center the QR code inside the green box.",
              "success"
            );


            await videoElement.play();


            initializeQrDecoder();


          } catch (fatal) {

            console.error(
              "Camera initialization failed:",
              fatal
            );


            startButton.disabled =
              false;


            setStatus(
              "Camera access failed. Please allow camera access in your browser settings and try again.",
              "error"
            );

          }

        }

      }
    );


    // ============================================================
    // INITIALIZE QR DECODER
    // ============================================================

    function initializeQrDecoder() {

      nativeDetector =
        null;


      if (
        "BarcodeDetector" in window
      ) {

        try {

          nativeDetector =
            new window.BarcodeDetector({
              formats: ["qr_code"]
            });

        } catch (error) {

          console.warn(
            "BarcodeDetector unavailable.",
            error
          );

          nativeDetector =
            null;

        }

      }


      startScanningLoop();

    }


    // ============================================================
    // SCANNING LOOP
    // ============================================================

    function startScanningLoop() {

      if (scanInterval) {

        clearInterval(
          scanInterval
        );

      }


      scanInterval =
        setInterval(
          async function() {

            if (scanAccepted) {

              return;

            }


            if (
              videoElement.readyState <
              videoElement.HAVE_CURRENT_DATA
            ) {

              return;

            }


            // ----------------------------------------------------
            // NATIVE BARCODE DETECTOR
            // ----------------------------------------------------

            if (nativeDetector) {

              try {

                const barcodes =
                  await nativeDetector.detect(
                    videoElement
                  );


                if (
                  barcodes &&
                  barcodes.length > 0
                ) {

                  transmitVolunteerToken(
                    barcodes[0].rawValue
                  );

                  return;

                }

              } catch (error) {

                console.warn(
                  "Native QR detection failed.",
                  error
                );

              }

            }


            // ----------------------------------------------------
            // jsQR FALLBACK
            // ----------------------------------------------------

            if (
              typeof jsQR === "function"
            ) {

              try {

                scanWithJsQr();

              } catch (error) {

                console.warn(
                  "jsQR scanning failed.",
                  error
                );

              }

            }

          },
          200
        );

    }


    // ============================================================
    // jsQR DECODER
    // ============================================================

    function scanWithJsQr() {

      const width =
        videoElement.videoWidth;

      const height =
        videoElement.videoHeight;


      if (
        !width ||
        !height
      ) {

        return;

      }


      canvasElement.width =
        width;

      canvasElement.height =
        height;


      canvasContext.drawImage(
        videoElement,
        0,
        0,
        width,
        height
      );


      const imageData =
        canvasContext.getImageData(
          0,
          0,
          width,
          height
        );


      const code =
        jsQR(
          imageData.data,
          imageData.width,
          imageData.height,
          {
            inversionAttempts:
              "attemptBoth"
          }
        );


      if (
        code &&
        code.data
      ) {

        transmitVolunteerToken(
          code.data
        );

      }

    }


    // ============================================================
    // TESTING
    // ============================================================
    //
    // Example:
    //
    // https://chaitalionthego.github.io/hyrox-qr-scanner/
    // ?returnUrl=https%3A%2F%2Fscript.google.com%2Fmacros%2Fs%2F...
    // &eventDay=18%20September
    //
    // ============================================================


    // ============================================================
    // CLEANUP
    // ============================================================

    window.addEventListener(
      "beforeunload",
      shutDownVideoHardware
    );


    // ============================================================
    // DEBUG INFORMATION
    // ============================================================

    console.log(
      "HYROX QR Scanner loaded."
    );

    console.log(
      "Return URL:",
      returnUrl
    );

    console.log(
      "Event Day:",
      selectedEventDay
    );

  </script>

</body>
</html>
