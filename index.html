<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HYROX QR Scanner</title>
  
  <!-- Points directly to your updated self-hosted file -->
  <script src="html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f5f5; color: #111; font-family: Arial, sans-serif; }
    main { max-width: 480px; margin: 0 auto; padding: 24px 18px; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); padding: 20px; }
    h1 { font-size: 23px; margin: 0 0 10px; }
    p { line-height: 1.45; }
    button { width: 100%; border: 0; border-radius: 8px; padding: 14px; background: #111; color: #fff; cursor: pointer; font-size: 16px; font-weight: bold; }
    button:disabled { background: #888; cursor:not-allowed; }
    #reader { margin-top: 18px; overflow: hidden; border-radius: 8px; background:#000; min-height: 250px; }
    #status { min-height: 24px; margin: 14px 0 0; font-weight: bold; }
    .error { color: #b42318; }
    .success { color: #18753a; }
  </style>
</head>



<body>
  <main>
    <div class="card">
      <h1>HYROX Volunteer QR Scan</h1>
      <p>Point the rear camera at the volunteer's QR code. The Volunteer ID will be sent back to the check-in page automatically.</p>

      <button id="startButton" type="button">Start Camera</button>
      <div id="reader"></div>
      <div id="status" aria-live="polite"></div>
    </div>
  </main>
    <script>
    const CHECKIN_WEB_APP_URL = "https://google.com";
    const statusElement = document.getElementById("status");
    const startButton = document.getElementById("startButton");
    let scanner = null;
    let scanAccepted = false;

    function setStatus(message, type) {
      statusElement.textContent = message;
      statusElement.className = type || "";
    }

    async function stopScanner() {
      if (!scanner) return;
      try { if (scanner.isScanning) { await scanner.stop(); } } catch (e) {}
      try { scanner.clear(); } catch(e) {}
      scanner = null;
    }

    async function onScanSuccess(decodedText) {
      if (scanAccepted) return;
      scanAccepted = true;
      const volunteerId = decodedText.trim();
      await stopScanner();

      const opener = window.opener;
      if (opener && !opener.closed) {
        try {
          opener.postMessage({ type: "hyroxVolunteerScan", volunteerId: volunteerId }, "*");
          setStatus("Scanned! Sent to your check-in screen.", "success");
          window.setTimeout(() => window.close(), 500);
          return;
        } catch (error) { console.warn(error); }
      }
      setStatus("Redirecting to volunteer record...", "success");
      window.location.replace(CHECKIN_WEB_APP_URL + "?volunteerId=" + encodeURIComponent(volunteerId));
    }

    startButton.addEventListener("click", async function() {
      if (!window.Html5Qrcode) {
        setStatus("Library failed to initialize cleanly.", "error");
        return;
      }
      startButton.disabled = true;
      setStatus("Initializing rear camera...");
      scanAccepted = false;
      await stopScanner();
      document.getElementById("reader").innerHTML = "";

      try {
        scanner = new Html5Qrcode("reader");

        // BUG 1 FIX: Strictly command the hardware layer to invoke the environment/rear camera lens array
        await scanner.start(
          { facingMode: "environment" },
          { 
            fps: 10, 
            qrbox: { width: 250, height: 250 },
            aspectRatio: 1.0
          }, 
          onScanSuccess, 
          function() {}
        );
        setStatus("Camera running live. Point at the volunteer badge QR code.", "success");
      } catch (error) {
        console.error(error);
        startButton.disabled = false;
        setStatus("Camera access failed. Details: " + (error.message || error), "error");
      }
    });
    window.addEventListener("beforeunload", stopScanner);
  </script>


</body>
</html>
