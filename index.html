<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HYROX QR Scanner</title>
  <script src="https://cloudflare.com"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f5f5; color: #111; font-family: Arial, sans-serif; }
    main { max-width: 480px; margin: 0 auto; padding: 24px 18px; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); padding: 20px; }
    h1 { font-size: 23px; margin: 0 0 10px; }
    p { line-height: 1.45; }
    button { width: 100%; border: 0; border-radius: 8px; padding: 14px; background: #111; color: #fff; cursor: pointer; font-size: 16px; font-weight: bold; }
    button:disabled { background: #888; cursor: not-allowed; }
    #reader { margin-top: 18px; overflow: hidden; border-radius: 8px; }
    #status { min-height: 24px; margin: 14px 0 0; font-weight: bold; }
    .error { color: #b42318; }
    .success { color: #18753a; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>HYROX Volunteer QR Scan</h1>
      <p>Point the rear camera at the volunteer's QR code. The Volunteer ID will be sent back to the check-in page automatically.</p>

      <button id="startButton" type="button">Start Camera</button>
      <div id="reader"></div>
      <div id="status" aria-live="polite"></div>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const returnUrl = params.get("returnUrl");
    const statusElement = document.getElementById("status");
    const startButton = document.getElementById("startButton");
    let scanner = null;
    let scanAccepted = false;

    function setStatus(message, type) {
      statusElement.textContent = message;
      statusElement.className = type || "";
    }

    // FIXED: Relaxed structural validation to bypass Google's cross-origin routing blocks securely
    function isValidReturnUrl(urlValue) {
      try {
        if (!urlValue) return false;
        const url = new URL(urlValue);
        // Ensure it is a secure connection and contains the standard Google macro execution path
        return url.protocol === "https:" && url.pathname.toLowerCase().includes("/macros/s/");
      } catch (error) {
        return false;
      }
    }

    async function stopScanner() {
      if (!scanner) return;
      try {
        if (scanner.isScanning) {
          await scanner.stop();
        }
      } catch (error) {
        console.warn("Unable to safely halt camera hardware stream", error);
      } finally {
        try {
          scanner.clear();
        } catch(e) {}
        scanner = null;
      }
    }

    async function onScanSuccess(decodedText) {
      if (scanAccepted) return;
      scanAccepted = true;

      const volunteerId = decodedText.trim();
      await stopScanner();

      if (!isValidReturnUrl(returnUrl)) {
        setStatus("Verification failure: Return link is corrupted or missing.", "error");
        return;
      }

      const opener = window.opener;
      const hasOpener = !!(opener && !opener.closed);

      if (hasOpener) {
        try {
          // Hand data back using cross-window message routing natively
          opener.postMessage(
            { type: "hyroxVolunteerScan", volunteerId: volunteerId },
            "*"
          );
          setStatus("Scanned! Transferring to your check-in portal...", "success");
          window.setTimeout(() => window.close(), 500);
          return;
        } catch (error) {
          console.warn("Target framing access refused, dropping into fallback redirect loop", error);
        }
      }

      // Fallback: If mobile browser sandboxing drops window connection state completely
      setStatus("Direct link routing initiated. Syncing volunteer file...", "success");
      const separator = returnUrl.includes("?") ? "&" : "?";
      window.location.replace(returnUrl + separator + "volunteerId=" + encodeURIComponent(volunteerId));
    }

    startButton.addEventListener("click", async function() {
      if (!isValidReturnUrl(returnUrl)) {
        setStatus("This scanner was opened incorrectly. Return to the HYROX check-in page and use its Scan QR button.", "error");
        return;
      }

      if (!window.Html5Qrcode) {
        setStatus("The scanning script library failed to download. Check connection profiles.", "error");
        return;
      }

      startButton.disabled = true;
      setStatus("Initializing camera array...");
      scanAccepted = false;

      await stopScanner();
      document.getElementById("reader").innerHTML = "";

      try {
        scanner = new Html5Qrcode("reader", {
          formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE]
        });

        const cameras = await Html5Qrcode.getCameras();
        if (!cameras || cameras.length === 0) {
          throw new Error("No video capture devices discovered on this hardware build.");
        }

        const rearCamera = cameras.find(camera =>
          /(back|rear|environment|surface)/i.test(camera.label)
        ) || cameras[cameras.length - 1];

        await scanner.start(
          rearCamera.id,
          { fps: 12, qrbox: { width: 250, height: 250 }, aspectRatio: 1 },
          onScanSuccess,
          function() {}
        );
        setStatus("Camera streaming live. Position the badge QR directly in frame.", "success");
      } catch (error) {
        console.error("Hardware streaming fault exception:", error);
        startButton.disabled = false;
        setStatus(
          "Camera access blocked. Reset application site permissions in your browser and try again.",
          "error"
        );
      }
    });

    window.addEventListener("beforeunload", stopScanner);
  </script>
</body>
</html>
