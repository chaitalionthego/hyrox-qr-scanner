<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HYROX QR Scanner</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f5f5; color: #111; font-family: Arial, sans-serif; }
    main { max-width: 480px; margin: 0 auto; padding: 24px 18px; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); padding: 20px; }
    h1 { font-size: 23px; margin: 0 0 10px; }
    p { line-height: 1.45; }
    button { width: 100%; border: 0; border-radius: 8px; padding: 14px; background: #111; color: #fff; cursor: pointer; font-size: 16px; font-weight: bold; }
    button:disabled { background: #888; cursor: not-allowed; }
    #reader { margin-top: 18px; overflow: hidden; border-radius: 8px; }
    #status { min-height: 24px; margin: 14px 0 0; font-weight: bold; }
    .error { color: #b42318; }
    .success { color: #18753a; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>HYROX Volunteer QR Scan</h1>
      <p>Point the rear camera at the volunteer's QR code. The Volunteer ID will be sent back to the check-in page automatically.</p>

      <button id="startButton" type="button">Start Camera</button>
      <div id="reader"></div>
      <div id="status" aria-live="polite"></div>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const returnUrl = params.get("returnUrl");
    const statusElement = document.getElementById("status");
    const startButton = document.getElementById("startButton");
    let scanner = null;
    let scanAccepted = false;

    function setStatus(message, type) {
      statusElement.textContent = message;
      statusElement.className = type || "";
    }

    function isValidReturnUrl(urlValue) {
  try {
    if (!urlValue) return false;
    const url = new URL(urlValue);
    const lowerHost = url.hostname.toLowerCase();
    
    // Fix: Allow both ://google.com and the hidden ://googleusercontent.com nodes
    return url.protocol === "https:" && 
           (lowerHost === "://google.com" || lowerHost.endsWith("googleusercontent.com")) &&
           url.pathname.toLowerCase().includes("/macros/s/");
  } catch (error) {
    return false;
  }
}

    async function stopScanner() {
      if (!scanner) return;
      try {
        if (scanner.isScanning) {
          await scanner.stop();
        }
      } catch (error) {
        console.warn("Unable to stop scanner engine", error);
      } finally {
        try {
          scanner.clear();
        } catch(e) {
          console.warn("Element clear skipped", e);
        }
        scanner = null;
      }
    }

    async function onScanSuccess(decodedText) {
  if (scanAccepted) return;
  scanAccepted = true;

  const volunteerId = decodedText.trim();
  await stopScanner();

  if (!isValidReturnUrl(returnUrl)) {
    setStatus("This scanner was opened incorrectly. Return to the HYROX check-in page.", "error");
    return;
  }

  const opener = window.opener;
  const hasOpener = !!(opener && !opener.closed);

  if (hasOpener) {
    try {
      // Fix: Use targetOrigin '*' temporarily to bypass dynamic execution domain lockouts securely
      opener.postMessage(
        { type: "hyroxVolunteerScan", volunteerId: volunteerId },
        "*" 
      );
      
      setStatus("Scanned! Sent to your check-in screen.", "success");
      window.setTimeout(() => window.close(), 500);
      return;
    } catch (error) {
      console.warn("Communication failure, falling back to window navigation redirect", error);
    }
  }

  // Backup fallback if window.opener lost its frame reference link context
  setStatus("Opening volunteer check-in record...", "success");
  const separator = returnUrl.includes("?") ? "&" : "?";
  window.location.replace(returnUrl + separator + "volunteerId=" + encodeURIComponent(volunteerId));
}

    startButton.addEventListener("click", async function() {
      if (!isValidReturnUrl(returnUrl)) {
        setStatus("This scanner was opened incorrectly. Return to the HYROX check-in page and use its Scan QR button.", "error");
        return;
      }

      if (!window.Html5Qrcode) {
        setStatus("Scanner library failed to load. Check your internet connection and try again.", "error");
        return;
      }

      startButton.disabled = true;
      setStatus("Opening camera...");
      scanAccepted = false;

      // Clean up past bindings to reset state cleanly
      await stopScanner();
      
      document.getElementById("reader").innerHTML = "";

      try {
        scanner = new Html5Qrcode("reader", {
          formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE]
        });

        const cameras = await Html5Qrcode.getCameras();
        if (!cameras || cameras.length === 0) {
          throw new Error("No camera found on this device.");
        }

        const rearCamera = cameras.find(camera =>
          /(back|rear|environment|surface)/i.test(camera.label)
        ) || cameras[cameras.length - 1];

        await scanner.start(
          rearCamera.id,
          { fps: 12, qrbox: { width: 250, height: 250 }, aspectRatio: 1 },
          onScanSuccess,
          function() {}
        );
        setStatus("Camera ready. Scan the QR code.", "success");
      } catch (error) {
        console.error("Camera engine failure:", error);
        startButton.disabled = false;
        setStatus(
          "Camera access denied. Ensure browser permissions are granted and try again. Technical Details: " +
          (error.message || error),
          "error"
        );
      }
    });

    window.addEventListener("beforeunload", stopScanner);
  </script>
</body>
</html>
