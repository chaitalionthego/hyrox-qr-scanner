<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HYROX QR Scanner</title>
  
  <!-- Primary CDN Endpoint -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  
  <!-- Fail-Safe Backup Network Routing Routine -->
  <script>
    if (!window.Html5Qrcode) {
      console.warn("Primary CDN failed. Attempting failover...");
      document.write('<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"><\/script>');
    }
  </script>
  <script>
    if (!window.Html5Qrcode) {
      console.warn("Secondary CDN failed. Attempting final failover...");
      document.write('<script src="https://jsdelivr.net"><\/script>');
    }
  </script>

  <style>
    /* Compact styling for HYROX scanner */
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f5f5; font-family: sans-serif; }
    main { max-width: 480px; margin: 0 auto; padding: 20px; }
    .card { background: #fff; border-radius: 12px; padding: 20px; }
    #reader { margin-top: 18px; border-radius: 8px; }
  </style>
</head>

<body>
  <main>
    <div class="card">
      <h1>HYROX Volunteer QR Scan</h1>
      <p>Point the rear camera at the volunteer's QR code. The Volunteer ID will be sent back to the check-in page automatically.</p>

      <button id="startButton" type="button">Start Camera</button>
      <div id="reader"></div>
      <div id="status" aria-live="polite"></div>
    </div>
  </main>

  <script>
    // HARDCODED FIX: Paste your exact app URL directly here so parameters can't break it
    const CHECKIN_WEB_APP_URL = "https://google.com";
    
    const statusElement = document.getElementById("status");
    const startButton = document.getElementById("startButton");
    let scanner = null;
    let scanAccepted = false;

    function setStatus(message, type) {
      statusElement.textContent = message;
      statusElement.className = type || "";
    }

    async function stopScanner() {
      if (!scanner) return;
      try {
        if (scanner.isScanning) {
          await scanner.stop();
        }
      } catch (error) {
        console.warn("Camera shut down cleanly:", error);
      } finally {
        try {
          scanner.clear();
        } catch(e) {}
        scanner = null;
      }
    }

    async function onScanSuccess(decodedText) {
      if (scanAccepted) return;
      scanAccepted = true;

      const volunteerId = decodedText.trim();
      await stopScanner();

      const opener = window.opener;
      const hasOpener = !!(opener && !opener.closed);

      if (hasOpener) {
        try {
          // Send data back using cross-window message routing natively [1]
          opener.postMessage(
            { type: "hyroxVolunteerScan", volunteerId: volunteerId },
            "*"
          );
          setStatus("Scanned! Transferring to your check-in portal...", "success");
          window.setTimeout(() => window.close(), 500);
          return;
        } catch (error) {
          console.warn("PostMessage failed, falling back to direct web redirect", error);
        }
      }

      // Safe Fallback: If mobile browser sandboxing breaks window.opener, redirect directly
      setStatus("Redirecting to volunteer record...", "success");
      const separator = CHECKIN_WEB_APP_URL.includes("?") ? "&" : "?";
      window.location.replace(CHECKIN_WEB_APP_URL + separator + "volunteerId=" + encodeURIComponent(volunteerId));
    }

    startButton.addEventListener("click", async function() {
      if (!window.Html5Qrcode) {
        setStatus("The scanning script library failed to download. Check connection profiles.", "error");
        return;
      }

      startButton.disabled = true;
      setStatus("Initializing camera...");
      scanAccepted = false;

      await stopScanner();
      document.getElementById("reader").innerHTML = "";

      try {
        scanner = new Html5Qrcode("reader", {
          formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE]
        });

        const cameras = await Html5Qrcode.getCameras();
        if (!cameras || cameras.length === 0) {
          throw new Error("No cameras found on this device.");
        }

        const rearCamera = cameras.find(camera =>
          /(back|rear|environment|surface)/i.test(camera.label)
        ) || cameras[cameras.length - 1];

        await scanner.start(
          rearCamera.id,
          { fps: 12, qrbox: { width: 250, height: 250 }, aspectRatio: 1 },
          onScanSuccess,
          function() {}
        );
        setStatus("Camera ready. Scan the badge QR code.", "success");
      } catch (error) {
        console.error("Camera error:", error);
        startButton.disabled = false;
        setStatus("Camera access blocked. Reset app permissions in your browser and try again.", "error");
      }
    });

    window.addEventListener("beforeunload", stopScanner);
  </script>
</body>
</html>
