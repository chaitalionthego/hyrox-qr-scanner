<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>HYROX QR Scanner</title>

  <!-- jsQR fallback decoder -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f5f5;
      color: #111;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 18px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
      padding: 20px;
    }

    h1 {
      font-size: 23px;
      margin: 0 0 10px;
    }

    p {
      line-height: 1.45;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 14px;
      background: #111;
      color: #fff;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    button:disabled {
      background: #888;
      cursor: not-allowed;
    }

    #reader {
      margin-top: 18px;
      overflow: hidden;
      border-radius: 8px;
      background: #000;
      display: none;
      position: relative;
    }

    video {
      width: 100%;
      height: auto;
      display: block;
      background: #000;
    }

    #status {
      min-height: 24px;
      margin: 14px 0 0;
      font-weight: bold;
    }

    .error {
      color: #b42318;
    }

    .success {
      color: #18753a;
    }

    .scan-region-highlight {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 220px;
      height: 220px;
      border: 4px solid #1c8c3a;
      border-radius: 12px;
      box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.5);
      pointer-events: none;
    }

    #scanCanvas {
      display: none;
    }
  </style>
</head>


<body>

  <main>

    <div class="card">

      <h1>HYROX Volunteer QR Scan</h1>

      <p>
        Point the rear camera at the volunteer's QR code.
        The Volunteer ID will automatically be sent back
        to the check-in page.
      </p>

      <button
        id="startButton"
        type="button"
      >
        Start Camera
      </button>

      <div id="reader">

        <video
          id="webcamPreview"
          autoplay
          playsinline
          muted>
        </video>

        <div class="scan-region-highlight"></div>

      </div>

      <canvas id="scanCanvas"></canvas>

      <div
        id="status"
        aria-live="polite">
      </div>

    </div>

  </main>


  <script>

    // ============================================================
    // CONFIGURATION
    // ============================================================

    const RETURN_URL_STORAGE_KEY =
  "hyroxCheckInReturnUrl";

const CHECKIN_URL =
  "https://script.google.com/macros/s/AKfycbxPtX-lbjUGHdxMpBu5LoGN1nlAgdXedBdYxyyIGtdZ8OMxwi4rLd_IMmqUd7V369o/exec";

const EVENT_DAY_STORAGE_KEY =
  "hyroxCheckInEventDay";


    // ============================================================
    // DOM ELEMENTS
    // ============================================================

    const statusElement =
      document.getElementById("status");

    const startButton =
      document.getElementById("startButton");

    const readerElement =
      document.getElementById("reader");

    const videoElement =
      document.getElementById("webcamPreview");

    const canvasElement =
      document.getElementById("scanCanvas");

    const canvasContext =
      canvasElement.getContext("2d", {
        willReadFrequently: true
      });


    // ============================================================
    // STATE
    // ============================================================

    let activeStream = null;

    let scanInterval = null;

    let scanAccepted = false;

    let nativeDetector = null;

    let RETURN_URL = "";


    // ============================================================
    // STATUS
    // ============================================================

    function setStatus(message, type) {

      statusElement.textContent =
        message;

      statusElement.className =
        type || "";

    }


    // ============================================================
    // RETURN URL
    // ============================================================

    function getReturnUrl() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  // ----------------------------------------------------------
  // 1. URL returnUrl
  // ----------------------------------------------------------

  const urlReturn =
    params.get("returnUrl");

  if (urlReturn) {

    try {

      localStorage.setItem(
        RETURN_URL_STORAGE_KEY,
        urlReturn
      );

      return urlReturn;

    } catch (error) {

      console.warn(
        "Could not save return URL:",
        error
      );

      return urlReturn;
    }
  }


  // ----------------------------------------------------------
  // 2. localStorage
  // ----------------------------------------------------------

  try {

    const storedReturnUrl =
      localStorage.getItem(
        RETURN_URL_STORAGE_KEY
      );

    if (storedReturnUrl) {
      return storedReturnUrl;
    }

  } catch (error) {

    console.warn(
      "localStorage unavailable:",
      error
    );
  }


  // ----------------------------------------------------------
  // 3. HARD FALLBACK
  // ----------------------------------------------------------

  return CHECKIN_URL;
}
function getEventDay() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const urlEventDay =
    params.get("eventDay");

  if (urlEventDay) {

    try {

      localStorage.setItem(
        EVENT_DAY_STORAGE_KEY,
        urlEventDay
      );

    } catch (error) {

      console.warn(
        "Could not save event day:",
        error
      );
    }

    return urlEventDay;
  }


  try {

    return (
      localStorage.getItem(
        EVENT_DAY_STORAGE_KEY
      ) || ""
    );

  } catch (error) {

    return "";
  }
}

    // ------------------------------------------------------------
    // IMPORTANT:
    //
    // We capture the return URL immediately when the scanner page
    // loads.
    //
    // The Start Camera button does NOT validate it.
    //
    // This avoids the iPhone issue where Safari/Chrome reloads
    // the scanner page when camera permission is requested.
    // ------------------------------------------------------------

    RETURN_URL =
      getReturnUrl();


    console.log(
      "HYROX scanner return URL:",
      RETURN_URL
    );


    // ============================================================
    // STOP CAMERA
    // ============================================================

    function shutDownVideoHardware() {

      if (scanInterval) {

        clearInterval(
          scanInterval
        );

        scanInterval = null;
      }


      if (activeStream) {

        activeStream
          .getTracks()
          .forEach(
            function(track) {
              track.stop();
            }
          );

        activeStream = null;
      }


      videoElement.srcObject =
        null;

      readerElement.style.display =
        "none";
    }


    // ============================================================
    // RETURN TO CHECK-IN PAGE
    // ============================================================

   function returnToCheckIn(volunteerId) {

  const cleanVolunteerId =
    String(volunteerId || "").trim();

  if (!cleanVolunteerId) {
    return false;
  }

  const returnUrl =
    getReturnUrl();

  const eventDay =
    getEventDay();

  try {

    const destinationUrl =
      new URL(returnUrl);

    destinationUrl.searchParams.set(
      "volunteerId",
      cleanVolunteerId
    );

    if (eventDay) {

      destinationUrl.searchParams.set(
        "eventDay",
        eventDay
      );

    }

    const destination =
      destinationUrl.toString();

    console.log(
      "Returning to check-in:",
      destination
    );

    window.location.replace(
      destination
    );

    return true;

  } catch (error) {

    console.error(
      "Could not create check-in URL:",
      error
    );

    setStatus(
      "Unable to create the check-in page address.",
      "error"
    );

    scanAccepted = false;

    return false;
  }
}


    // ============================================================
    // QR CODE FOUND
    // ============================================================

    function transmitVolunteerToken(
      rawId
    ) {

      if (scanAccepted) {
        return;
      }


      const volunteerId =
        String(
          rawId || ""
        ).trim();


      if (!volunteerId) {
        return;
      }


      // ----------------------------------------------------------
      // Only accept HYROX volunteer IDs.
      //
      // Example:
      // HYXMUM260010
      // ----------------------------------------------------------

      if (
        !volunteerId
          .toUpperCase()
          .startsWith("HYXMUM26")
      ) {

        setStatus(
          "This QR code is not a valid HYROX Mumbai volunteer QR code.",
          "error"
        );

        return;
      }


      scanAccepted =
        true;


      shutDownVideoHardware();


      returnToCheckIn(
        volunteerId
      );
    }


    // ============================================================
    // START CAMERA
    // ============================================================

    startButton.addEventListener(
      "click",
      async function() {

        // --------------------------------------------------------
        // IMPORTANT:
        //
        // DO NOT check RETURN_URL here.
        //
        // iPhone Safari/Chrome/Google app can reload or recreate
        // the page during camera permission handling.
        //
        // The return URL was already stored when the page loaded.
        // --------------------------------------------------------

        startButton.disabled =
          true;


        setStatus(
          "Initializing rear camera...",
          "success"
        );


        scanAccepted =
          false;


        shutDownVideoHardware();


        const constraints = {

          video: {

            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }

          },

          audio: false

        };


        try {

          activeStream =
            await navigator.mediaDevices.getUserMedia(
              constraints
            );


          videoElement.srcObject =
            activeStream;


          readerElement.style.display =
            "block";


          setStatus(
            "Rear camera running. Center the QR code inside the green box.",
            "success"
          );


          await videoElement.play();


          initializeQrDecoder();


        } catch (error) {

          console.error(
            "Rear camera failed:",
            error
          );


          // ------------------------------------------------------
          // Fallback camera request
          // ------------------------------------------------------

          try {

            activeStream =
              await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: false
              });


            videoElement.srcObject =
              activeStream;


            readerElement.style.display =
              "block";


            setStatus(
              "Camera online. Center the QR code inside the green box.",
              "success"
            );


            await videoElement.play();


            initializeQrDecoder();


          } catch (fatal) {

            console.error(
              "Camera initialization failed:",
              fatal
            );


            startButton.disabled =
              false;


            setStatus(
              "Camera access failed. Please allow camera access in your browser settings and try again.",
              "error"
            );

          }

        }

      }
    );


    // ============================================================
    // INITIALIZE QR DECODER
    // ============================================================

    function initializeQrDecoder() {

      nativeDetector =
        null;


      // ----------------------------------------------------------
      // Browser native BarcodeDetector
      // ----------------------------------------------------------

      if (
        "BarcodeDetector" in window
      ) {

        try {

          nativeDetector =
            new window.BarcodeDetector({
              formats: ["qr_code"]
            });

        } catch (error) {

          console.warn(
            "BarcodeDetector unavailable.",
            error
          );

          nativeDetector =
            null;
        }
      }


      startScanningLoop();
    }


    // ============================================================
    // SCANNING LOOP
    // ============================================================

    function startScanningLoop() {

      if (scanInterval) {

        clearInterval(
          scanInterval
        );
      }


      scanInterval =
        setInterval(
          async function() {

            if (scanAccepted) {
              return;
            }


            if (
              videoElement.readyState <
              videoElement.HAVE_CURRENT_DATA
            ) {

              return;
            }


            // ----------------------------------------------------
            // NATIVE BARCODE DETECTOR
            // ----------------------------------------------------

            if (nativeDetector) {

              try {

                const barcodes =
                  await nativeDetector.detect(
                    videoElement
                  );


                if (
                  barcodes &&
                  barcodes.length > 0
                ) {

                  const rawValue =
                    barcodes[0].rawValue;


                  if (rawValue) {

                    transmitVolunteerToken(
                      rawValue
                    );

                    return;
                  }

                }

              } catch (error) {

                console.warn(
                  "Native QR detection failed.",
                  error
                );

              }

            }


            // ----------------------------------------------------
            // jsQR FALLBACK
            // ----------------------------------------------------

            if (
              typeof jsQR ===
              "function"
            ) {

              try {

                scanWithJsQr();

              } catch (error) {

                console.warn(
                  "jsQR scanning failed.",
                  error
                );

              }

            }

          },
          200
        );
    }


    // ============================================================
    // jsQR DECODER
    // ============================================================

    function scanWithJsQr() {

      const width =
        videoElement.videoWidth;

      const height =
        videoElement.videoHeight;


      if (
        !width ||
        !height
      ) {

        return;
      }


      canvasElement.width =
        width;

      canvasElement.height =
        height;


      canvasContext.drawImage(
        videoElement,
        0,
        0,
        width,
        height
      );


      const imageData =
        canvasContext.getImageData(
          0,
          0,
          width,
          height
        );


      const code =
        jsQR(
          imageData.data,
          imageData.width,
          imageData.height,
          {
            inversionAttempts:
              "attemptBoth"
          }
        );


      if (
        code &&
        code.data
      ) {

        transmitVolunteerToken(
          code.data
        );

      }

    }


    // ============================================================
    // TESTING
    // ============================================================
    //
    // You can test without a camera using:
    //
    // https://chaitalionthego.github.io/hyrox-qr-scanner/?id=HYXMUM260001
    //
    // ============================================================

    const testParams =
      new URLSearchParams(
        window.location.search
      );


    if (
      testParams.has("id")
    ) {

      const testVolunteerId =
        testParams.get("id");


      if (testVolunteerId) {

        window.setTimeout(
          function() {

            transmitVolunteerToken(
              testVolunteerId
            );

          },
          500
        );

      }

    }


    // ============================================================
    // CLEANUP
    // ============================================================

    window.addEventListener(
      "beforeunload",
      function() {

        shutDownVideoHardware();

      }
    );

  </script>

</body>

</html>
