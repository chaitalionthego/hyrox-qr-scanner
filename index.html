<!doctype html>

<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    HYROX Volunteer QR Scanner
  </title>


  <!-- jsQR -->

  <script
    src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"
  ></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      background: #f5f5f5;

      color: #111;

      font-family:
        Arial,
        sans-serif;

    }


    main {

      width: 100%;

      max-width: 480px;

      margin: 0 auto;

      padding: 20px 16px;

    }


    .card {

      background: #fff;

      border-radius: 14px;

      padding: 20px;

      box-shadow:
        0 2px 10px
        rgba(0,0,0,.08);

    }


    h1 {

      margin:
        0 0 10px;

      font-size: 24px;

    }


    p {

      line-height: 1.45;

    }


    button {

      width: 100%;

      border: 0;

      border-radius: 9px;

      padding: 15px;

      background: #111;

      color: #fff;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

    }


    button:disabled {

      background: #888;

      cursor: not-allowed;

    }


    #reader {

      display: none;

      position: relative;

      margin-top: 18px;

      overflow: hidden;

      border-radius: 10px;

      background: #000;

    }


    video {

      width: 100%;

      height: auto;

      display: block;

      background: #000;

    }


    .scan-box {

      position: absolute;

      left: 50%;

      top: 50%;

      width: 220px;

      height: 220px;

      transform:
        translate(-50%, -50%);

      border:
        4px solid #20a34a;

      border-radius: 12px;

      pointer-events: none;

      box-shadow:
        0 0 0 2000px
        rgba(0,0,0,.45);

    }


    #status {

      min-height: 24px;

      margin-top: 15px;

      font-weight: bold;

      line-height: 1.4;

    }


    .success {

      color: #18753a;

    }


    .error {

      color: #b42318;

    }


    #scanCanvas {

      display: none;

    }

  </style>

</head>


<body>

<main>

  <div class="card">

    <h1>
      HYROX Volunteer QR Scan
    </h1>


    <p>
      Point the rear camera at the volunteer's QR code.
      The scanner will automatically return to the
      check-in page after a successful scan.
    </p>


    <button
      id="startButton"
      type="button"
    >
      Start Camera
    </button>


    <div id="reader">

      <video
        id="webcamPreview"
        autoplay
        playsinline
        muted
      ></video>


      <div class="scan-box"></div>

    </div>


    <canvas
      id="scanCanvas"
    ></canvas>


    <div
      id="status"
      aria-live="polite"
    ></div>

  </div>

</main>


<script>

// ============================================================
// PARAMETERS
// ============================================================

const params =
  new URLSearchParams(
    window.location.search
  );


const returnUrl =
  params.get("returnUrl") ||
  "";


const eventDay =
  params.get("eventDay") ||
  "";


// ============================================================
// DOM
// ============================================================

const startButton =
  document.getElementById(
    "startButton"
  );


const readerElement =
  document.getElementById(
    "reader"
  );


const videoElement =
  document.getElementById(
    "webcamPreview"
  );


const canvasElement =
  document.getElementById(
    "scanCanvas"
  );


const canvasContext =
  canvasElement.getContext(
    "2d",
    {
      willReadFrequently:
        true
    }
  );


const statusElement =
  document.getElementById(
    "status"
  );


// ============================================================
// STATE
// ============================================================

let activeStream =
  null;

let scanInterval =
  null;

let scanAccepted =
  false;


// ============================================================
// STATUS
// ============================================================

function setStatus(
  message,
  type
) {

  statusElement.textContent =
    message;

  statusElement.className =
    type || "";

}


// ============================================================
// STOP CAMERA
// ============================================================

function stopCamera() {

  if (scanInterval) {

    clearInterval(
      scanInterval
    );

    scanInterval =
      null;

  }


  if (activeStream) {

    activeStream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );

    activeStream =
      null;

  }


  videoElement.srcObject =
    null;

}


// ============================================================
// RETURN TO CHECK-IN
// ============================================================

function returnToCheckIn(
  volunteerId
) {

  if (scanAccepted) {

    return;

  }


  volunteerId =
    String(
      volunteerId || ""
    ).trim();


  if (!volunteerId) {

    return;

  }


  if (!returnUrl) {

    setStatus(
      "Unable to find the check-in page. Please go back and open Scan Volunteer QR again.",
      "error"
    );

    return;

  }


  if (!eventDay) {

    setStatus(
      "Event day was not provided. Please go back to the check-in page and select an event day.",
      "error"
    );

    return;

  }


  scanAccepted =
    true;


  stopCamera();


  setStatus(
    "QR detected! Returning to check-in...",
    "success"
  );


  /*
   * Build the final Apps Script URL.
   *
   * Example:
   *
   * https://script.google.com/.../exec
   * ?volunteerId=HYXMUM260009
   * &eventDay=18%20September
   */

  const separator =
    returnUrl.includes("?")
      ? "&"
      : "?";


  const destination =
    returnUrl +
    separator +
    "volunteerId=" +
    encodeURIComponent(
      volunteerId
    ) +
    "&eventDay=" +
    encodeURIComponent(
      eventDay
    );


  console.log(
    "Returning to check-in:",
    destination
  );


  /*
   * NORMAL REDIRECT.
   *
   * No popup.
   * No opener.
   * No postMessage.
   */

  window.location.replace(
    destination
  );

}


// ============================================================
// START CAMERA
// ============================================================

startButton.addEventListener(
  "click",
  async function() {

    startButton.disabled =
      true;


    setStatus(
      "Opening camera...",
      "success"
    );


    scanAccepted =
      false;


    stopCamera();


    try {

      /*
       * Request the rear camera.
       */

      activeStream =
        await navigator.mediaDevices.getUserMedia({

          video: {

            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }

          },

          audio: false

        });


      videoElement.srcObject =
        activeStream;


      readerElement.style.display =
        "block";


      await videoElement.play();


      setStatus(
        "Camera ready. Center the QR code inside the green box.",
        "success"
      );


      startScanning();


    } catch (error) {

      console.error(
        "Camera error:",
        error
      );


      startButton.disabled =
        false;


      setStatus(
        "Camera access failed. Please allow camera access and try again.",
        "error"
      );

    }

  }
);


// ============================================================
// SCANNING
// ============================================================

function startScanning() {

  if (scanInterval) {

    clearInterval(
      scanInterval
    );

  }


  scanInterval =
    setInterval(
      function() {

        if (scanAccepted) {

          return;

        }


        if (
          videoElement.readyState <
          videoElement.HAVE_CURRENT_DATA
        ) {

          return;

        }


        scanWithJsQr();

      },
      200
    );

}


// ============================================================
// jsQR
// ============================================================

function scanWithJsQr() {

  const width =
    videoElement.videoWidth;


  const height =
    videoElement.videoHeight;


  if (
    !width ||
    !height
  ) {

    return;

  }


  canvasElement.width =
    width;


  canvasElement.height =
    height;


  canvasContext.drawImage(
    videoElement,
    0,
    0,
    width,
    height
  );


  const imageData =
    canvasContext.getImageData(
      0,
      0,
      width,
      height
    );


  const code =
    jsQR(
      imageData.data,
      imageData.width,
      imageData.height,
      {
        inversionAttempts:
          "attemptBoth"
      }
    );


  if (
    code &&
    code.data
  ) {

    console.log(
      "QR detected:",
      code.data
    );


    returnToCheckIn(
      code.data
    );

  }

}


// ============================================================
// DIRECT TEST MODE
// ============================================================
//
// Test scanner without camera:
//
// ?id=HYXMUM260001
//
// ============================================================

const testId =
  params.get("id");


if (testId) {

  setTimeout(
    function() {

      returnToCheckIn(
        testId
      );

    },
    500
  );

}


// ============================================================
// CLEANUP
// ============================================================

window.addEventListener(
  "beforeunload",
  stopCamera
);

</script>

</body>

</html>
