<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>HYROX QR Scanner</title>

  <!-- jsQR: QR-code decoder fallback -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f5f5;
      color: #111;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 18px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      padding: 20px;
    }

    h1 {
      font-size: 23px;
      margin: 0 0 10px;
    }

    p {
      line-height: 1.45;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 14px;
      background: #111;
      color: #fff;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    button:disabled {
      background: #888;
      cursor: not-allowed;
    }

    #reader {
      margin-top: 18px;
      overflow: hidden;
      border-radius: 8px;
      background: #000;
      display: none;
      position: relative;
    }

    video {
      width: 100%;
      height: auto;
      display: block;
      background: #000;
    }

    #status {
      min-height: 24px;
      margin: 14px 0 0;
      font-weight: bold;
    }

    .error {
      color: #b42318;
    }

    .success {
      color: #18753a;
    }

    /* Green QR target box */
    .scan-region-highlight {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 220px;
      height: 220px;
      border: 4px solid #1c8c3a;
      border-radius: 12px;
      box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.5);
      pointer-events: none;
    }

    /* Hidden canvas used for jsQR */
    #scanCanvas {
      display: none;
    }
  </style>
</head>

<body>

  <main>
    <div class="card">

      <h1>HYROX Volunteer QR Scan</h1>

      <p>
        Point the rear camera at the volunteer's QR code.
        The Volunteer ID will be sent back to the check-in
        page automatically.
      </p>

      <button id="startButton" type="button">
        Start Camera
      </button>

      <div id="reader">

        <video
          id="webcamPreview"
          autoplay
          playsinline
          muted>
        </video>

        <div class="scan-region-highlight"></div>

      </div>

      <canvas id="scanCanvas"></canvas>

      <div id="status" aria-live="polite"></div>

    </div>
  </main>


  <script>

    // ============================================================
    // CONFIGURATION
    // ============================================================

    


    // ============================================================
    // DOM ELEMENTS
    // ============================================================

    const statusElement =
      document.getElementById("status");

    const startButton =
      document.getElementById("startButton");

    const readerElement =
      document.getElementById("reader");

    const videoElement =
      document.getElementById("webcamPreview");

    const canvasElement =
      document.getElementById("scanCanvas");

    const canvasContext =
      canvasElement.getContext("2d", {
        willReadFrequently: true
      });


    // ============================================================
    // STATE
    // ============================================================

    let activeStream = null;

    let scanInterval = null;

    let scanAccepted = false;

    let nativeDetector = null;


    // ============================================================
    // STATUS
    // ============================================================

    function setStatus(message, type) {

      statusElement.textContent = message;

      statusElement.className = type || "";

    }


    // ============================================================
    // STOP CAMERA
    // ============================================================

    function shutDownVideoHardware() {

      if (scanInterval) {

        clearInterval(scanInterval);

        scanInterval = null;
      }


      if (activeStream) {

        activeStream
          .getTracks()
          .forEach(track => track.stop());

        activeStream = null;
      }


      videoElement.srcObject = null;

      readerElement.style.display = "none";
    }


    // ============================================================
    // SEND VOLUNTEER ID BACK TO MAIN CHECK-IN PAGE
    // ============================================================

function transmitVolunteerToken(rawId) {

  if (scanAccepted) return;

  const volunteerId =
    String(rawId || "").trim();

  if (!volunteerId) return;

  scanAccepted = true;

  shutDownVideoHardware();

  setStatus(
    "QR Code detected! Returning to check-in...",
    "success"
  );

  // ----------------------------------------------------------
  // Get the check-in screen URL passed when scanner was opened
  // ----------------------------------------------------------

  const params =
    new URLSearchParams(
      window.location.search
    );

  const returnUrl =
    params.get("returnUrl");

  // ----------------------------------------------------------
  // If we don't have a return URL, stop with a clear message
  // ----------------------------------------------------------

  if (!returnUrl) {

    setStatus(
      "Scanner was not opened from the check-in screen.",
      "error"
    );

    scanAccepted = false;

    return;
  }

  // ----------------------------------------------------------
  // Add Volunteer ID to the Apps Script check-in URL
  // ----------------------------------------------------------

  const connector =
    returnUrl.includes("?")
      ? "&"
      : "?";

  const destination =
    returnUrl +
    connector +
    "volunteerId=" +
    encodeURIComponent(volunteerId);

  console.log(
    "Returning to check-in:",
    destination
  );

  // ----------------------------------------------------------
  // Return directly to the check-in page
  // ----------------------------------------------------------

  window.location.href =
    destination;
}


    // ============================================================
    // START CAMERA
    // ============================================================

    startButton.addEventListener(
      "click",
      async function() {

        startButton.disabled = true;

        setStatus(
          "Initializing rear camera...",
          "success"
        );


        scanAccepted = false;


        shutDownVideoHardware();


        const constraints = {

          video: {

            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }
          },

          audio: false
        };


        try {

          activeStream =
            await navigator.mediaDevices.getUserMedia(
              constraints
            );


          videoElement.srcObject =
            activeStream;


          readerElement.style.display =
            "block";


          setStatus(
            "Rear camera running. Center the QR code inside the green box.",
            "success"
          );


          await videoElement.play();


          initializeQrDecoder();


        } catch (error) {

          console.error(
            "Rear camera failed:",
            error
          );


          // ------------------------------------------------------
          // Fallback camera request
          // ------------------------------------------------------

          try {

            activeStream =
              await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: false
              });


            videoElement.srcObject =
              activeStream;


            readerElement.style.display =
              "block";


            setStatus(
              "Camera online. Center the QR code inside the green box.",
              "success"
            );


            await videoElement.play();


            initializeQrDecoder();


          } catch (fatal) {

            console.error(
              "Camera initialization failed:",
              fatal
            );


            startButton.disabled = false;


            setStatus(
              "Camera access failed. Please allow camera access in your browser settings and try again.",
              "error"
            );
          }
        }
      }
    );


    // ============================================================
    // INITIALIZE QR DECODER
    // ============================================================

    function initializeQrDecoder() {

      nativeDetector = null;


      // ----------------------------------------------------------
      // First preference:
      // Browser's native BarcodeDetector
      // ----------------------------------------------------------

      if (
        "BarcodeDetector" in window
      ) {

        try {

          nativeDetector =
            new window.BarcodeDetector({
              formats: ["qr_code"]
            });

        } catch (error) {

          console.warn(
            "BarcodeDetector unavailable.",
            error
          );

          nativeDetector = null;
        }
      }


      // ----------------------------------------------------------
      // Start scanning loop.
      //
      // If native BarcodeDetector exists:
      //     use it.
      //
      // Otherwise:
      //     use jsQR.
      // ----------------------------------------------------------

      startScanningLoop();
    }


    // ============================================================
    // SCANNING LOOP
    // ============================================================

    function startScanningLoop() {

      if (scanInterval) {

        clearInterval(scanInterval);
      }


      scanInterval =
        setInterval(
          async function() {

            if (scanAccepted) {
              return;
            }


            if (
              videoElement.readyState <
              videoElement.HAVE_CURRENT_DATA
            ) {
              return;
            }


            // ----------------------------------------------------
            // NATIVE BARCODE DETECTOR
            // ----------------------------------------------------

            if (nativeDetector) {

              try {

                const barcodes =
                  await nativeDetector.detect(
                    videoElement
                  );


                if (
                  barcodes &&
                  barcodes.length > 0
                ) {

                  transmitVolunteerToken(
                    barcodes[0].rawValue
                  );

                  return;
                }

              } catch (error) {

                console.warn(
                  "Native QR detection failed.",
                  error
                );
              }
            }


            // ----------------------------------------------------
            // jsQR FALLBACK
            // ----------------------------------------------------

            if (
              typeof jsQR === "function"
            ) {

              try {

                scanWithJsQr();

              } catch (error) {

                console.warn(
                  "jsQR scanning failed.",
                  error
                );
              }
            }

          },
          200
        );
    }


    // ============================================================
    // jsQR DECODER
    // ============================================================

    function scanWithJsQr() {

      const width =
        videoElement.videoWidth;

      const height =
        videoElement.videoHeight;


      if (
        !width ||
        !height
      ) {
        return;
      }


      canvasElement.width =
        width;

      canvasElement.height =
        height;


      canvasContext.drawImage(
        videoElement,
        0,
        0,
        width,
        height
      );


      const imageData =
        canvasContext.getImageData(
          0,
          0,
          width,
          height
        );


      const code =
        jsQR(
          imageData.data,
          imageData.width,
          imageData.height,
          {
            inversionAttempts:
              "attemptBoth"
          }
        );


      if (
        code &&
        code.data
      ) {

        transmitVolunteerToken(
          code.data
        );
      }
    }


    // ============================================================
    // TESTING
    // ============================================================
    //
    // You can test the full scan → check-in flow without a camera:
    //
    // https://chaitalionthego.github.io/hyrox-qr-scanner/?id=HYXMUM260001
    //
    // ============================================================

    const testParams =
      new URLSearchParams(
        window.location.search
      );


    if (
      testParams.has("id")
    ) {

      const testVolunteerId =
        testParams.get("id");


      if (testVolunteerId) {

        window.setTimeout(
          function() {

            transmitVolunteerToken(
              testVolunteerId
            );

          },
          500
        );
      }
    }


    // ============================================================
    // CLEANUP
    // ============================================================

    window.addEventListener(
      "beforeunload",
      shutDownVideoHardware
    );

  </script>

</body>
</html>
