<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HYROX QR Scanner</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f5f5; color: #111; font-family: Arial, sans-serif; }
    main { max-width: 480px; margin: 0 auto; padding: 24px 18px; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); padding: 20px; }
    h1 { font-size: 23px; margin: 0 0 10px; }
    p { line-height: 1.45; }
    button { width: 100%; border: 0; border-radius: 8px; padding: 14px; background: #111; color: #fff; cursor: pointer; font-size: 16px; font-weight: bold; }
    button:disabled { background: #888; cursor: not-allowed; }
    #reader { margin-top: 18px; overflow: hidden; border-radius: 8px; background: #000; display: none; position: relative; }
    video { width: 100%; height: auto; display: block; background: #000; }
    #status { min-height: 24px; margin: 14px 0 0; font-weight: bold; }
    .error { color: #b42318; }
    .success { color: #18753a; }
    
    /* Interactive scanning terminal element box */
    .terminal-container { margin-top: 15px; padding: 15px; background: #111; border-radius: 8px; color: #fff; text-align: center; }
    .terminal-container input { width: 100%; padding: 12px; margin-top: 10px; border-radius: 6px; border: none; font-size: 16px; text-align: center; background: #fff; color: #000; font-weight: bold; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>HYROX Volunteer QR Scan</h1>
      <p>Point the rear camera at the volunteer's QR code. The Volunteer ID will be sent back to the check-in page automatically.</p>

      <button id="startButton" type="button">Start Camera</button>
      
      <div id="reader">
        <video id="webcamPreview" autoplay playsinline muted></video>
      </div>

      <!-- Native Fallback Terminal UI Interface Box -->
      <div id="terminalUi" class="terminal-container" style="display: none;">
        <label for="barcodeInput"><b>Scanner Status: Ready</b></label>
        <p style="font-size: 13px; opacity: 0.8; margin: 5px 0 10px;">Scan the volunteer badge badge or manually type their ID below:</p>
        <input id="barcodeInput" type="text" placeholder="e.g. HYXMUM260024" autocomplete="off">
      </div>

      <div id="status" aria-live="polite"></div>
    </div>
  </main>

  <script>
    const CHECKIN_WEB_APP_URL = "https://google.com";
    const statusElement = document.getElementById("status");
    const startButton = document.getElementById("startButton");
    const readerElement = document.getElementById("reader");
    const videoElement = document.getElementById("webcamPreview");
    const terminalUi = document.getElementById("terminalUi");
    const barcodeInput = document.getElementById("barcodeInput");
    
    let activeStream = null;

    function setStatus(message, type) {
      statusElement.textContent = message;
      statusElement.className = type || "";
    }

    function shutDownVideoHardware() {
      if (activeStream) {
        activeStream.getTracks().forEach(track => track.stop());
        activeStream = null;
      }
      videoElement.srcObject = null;
      readerElement.style.display = "none";
    }

    function transmitVolunteerToken(rawId) {
      const volunteerId = String(rawId || "").trim();
      if (!volunteerId) return;

      shutDownVideoHardware();
      terminalUi.style.display = "none";
      setStatus("Code verified! Synchronizing profile matrix configurations...", "success");

      const parentWindow = window.opener;
      if (parentWindow && !parentWindow.closed) {
        try {
          // Send scanned data directly to your main check-in screen tab
          parentWindow.postMessage({ type: "hyroxVolunteerScan", volunteerId: volunteerId }, "*");
          window.setTimeout(() => window.close(), 400);
          return;
        } catch (error) {
          console.warn("Cross-origin frame tracking postMessage blocked, invoking direct path fallback redirect:", error);
        }
      }

      // Safe backup redirect layout option
      const connector = CHECKIN_WEB_APP_URL.includes("?") ? "&" : "?";
      window.location.replace(CHECKIN_WEB_APP_URL + connector + "volunteerId=" + encodeURIComponent(volunteerId));
    }

    startButton.addEventListener("click", async function() {
      startButton.disabled = true;
      setStatus("Activating rear lens streaming lines...", "success");
      shutDownVideoHardware();

      // Enforce the phone's REAR lens capture stream explicitly
      const videoOptions = {
        video: { facingMode: { ideal: "environment" } },
        audio: false
      };

      try {
        activeStream = await navigator.mediaDevices.getUserMedia(videoOptions);
        videoElement.srcObject = activeStream;
        readerElement.style.display = "block";
        
        setStatus("Rear camera active. Point the lens directly at the badge code.", "success");
        initializeScannerInterface();
      } catch (hardwareFault) {
        console.warn("Strict facingMode string rejected. Falling back to default layout...", hardwareFault);
        try {
          activeStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          videoElement.srcObject = activeStream;
          readerElement.style.display = "block";
          
          setStatus("Camera link verified.", "success");
          initializeScannerInterface();
        } catch (fatalError) {
          console.error("Camera completely inaccessible:", fatalError);
          startButton.disabled = false;
          setStatus("Webcam initialization failed. Please update your Chrome browser site permission toggles to Allow.", "error");
          initializeScannerInterface();
        }
      }
    });

    function initializeScannerInterface() {
      // Reveal the terminal control console interface
      terminalUi.style.display = "block";
      barcodeInput.value = "";
      barcodeInput.focus();

      // Watch for data capture inputs from physical scanning guns or typing
      barcodeInput.addEventListener("keydown", function(event) {
        if (event.key === "Enter" && barcodeInput.value.trim()) {
          event.preventDefault();
          transmitVolunteerToken(barcodeInput.value.trim());
        }
      });
    }

    window.addEventListener("beforeunload", shutDownVideoHardware);
  </script>
</body>
</html>
