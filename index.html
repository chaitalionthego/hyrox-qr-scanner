<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HYROX QR Scanner</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f5f5; color: #111; font-family: Arial, sans-serif; }
    main { max-width: 480px; margin: 0 auto; padding: 24px 18px; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); padding: 20px; }
    h1 { font-size: 23px; margin: 0 0 10px; }
    p { line-height: 1.45; }
    button { width: 100%; border: 0; border-radius: 8px; padding: 14px; background: #111; color: #fff; cursor: pointer; font-size: 16px; font-weight: bold; }
    button:disabled { background: #888; cursor: not-allowed; }
    #reader { margin-top: 18px; overflow: hidden; border-radius: 8px; }
    #status { min-height: 24px; margin: 14px 0 0; font-weight: bold; }
    .error { color: #b42318; }
    .success { color: #18753a; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>HYROX Volunteer QR Scan</h1>
      <p>Point the rear camera at the volunteer's QR code. The Volunteer ID will be sent back to the check-in page automatically.</p>

      <button id="startButton" type="button">Start Camera</button>
      <div id="reader"></div>
      <div id="status" aria-live="polite"></div>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const returnUrl = params.get("returnUrl");
    const statusElement = document.getElementById("status");
    const startButton = document.getElementById("startButton");
    let scanner = null;
    let scanAccepted = false;

    function setStatus(message, type) {
      statusElement.textContent = message;
      statusElement.className = type || "";
    }

    function isValidReturnUrl(urlValue) {
      try {
        const url = new URL(urlValue);
        return url.protocol === "https:" && url.hostname === "script.google.com" &&
          url.pathname.startsWith("/macros/s/") && url.pathname.endsWith("/exec");
      } catch (error) {
        return false;
      }
    }

    async function stopScanner() {
      if (!scanner) return;

      try {
        if (scanner.isScanning) {
          await scanner.stop();
        }
        scanner.clear();
      } catch (error) {
        console.warn("Unable to stop scanner", error);
      }
    }

    async function onScanSuccess(decodedText) {
      if (scanAccepted) return;
      scanAccepted = true;

      const volunteerId = decodedText.trim();
      await stopScanner();

      if (!isValidReturnUrl(returnUrl)) {
        setStatus("This scanner was opened incorrectly. Return to the HYROX check-in page and use its Scan QR button.", "error");
        return;
      }

      const separator = returnUrl.includes("?") ? "&" : "?";
      const targetUrl = returnUrl + separator + "volunteerId=" + encodeURIComponent(volunteerId);

      // If this page was opened as a popup from the check-in app,
      // window.opener points back at that main tab. Browsers allow a
      // popup to navigate window.opener.location even cross-origin
      // (only *reading* cross-origin window properties is blocked), so
      // this updates the operator's main screen instead of the popup.
      const opener = window.opener;
      const hasOpener = !!(opener && !opener.closed);

      setStatus(
        hasOpener
          ? "QR code scanned. Updating your check-in screen..."
          : "QR code scanned. Opening the volunteer check-in record...",
        "success"
      );

      window.setTimeout(() => {

        if (hasOpener) {

          try {
            opener.location.replace(targetUrl);
            window.close();
            return;
          } catch (error) {
            // Fall through to self-navigation if, for any reason, the
            // opener can no longer be navigated (e.g. it was closed
            // between the check above and now).
            console.warn("Unable to update opener window, navigating scanner instead", error);
          }

        }

        // No opener available (scanner opened directly, not via the
        // check-in app's popup) — fall back to navigating this window.
        window.location.replace(targetUrl);

      }, 400);

    }

    startButton.addEventListener("click", async function() {
      if (!isValidReturnUrl(returnUrl)) {
        setStatus("This scanner was opened incorrectly. Return to the HYROX check-in page and use its Scan QR button.", "error");
        return;
      }

      if (!window.Html5Qrcode) {
        setStatus("Scanner library failed to load. Check your internet connection and try again.", "error");
        return;
      }

      startButton.disabled = true;
      setStatus("Opening camera...");
      scanAccepted = false;
      scanner = new Html5Qrcode("reader", {
        formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE]
      });

      try {
        // iPhone browsers are more reliable when the physical rear-camera
        // ID is selected explicitly instead of using facingMode alone.
        const cameras = await Html5Qrcode.getCameras();

        if (!cameras || cameras.length === 0) {
          throw new Error("No camera was found on this device.");
        }

        const rearCamera = cameras.find(camera =>
          /(back|rear|environment)/i.test(camera.label)
        ) || cameras[cameras.length - 1];

        await scanner.start(
          rearCamera.id,
          { fps: 10, qrbox: { width: 240, height: 240 }, aspectRatio: 1 },
          onScanSuccess,
          function() {}
        );
        setStatus("Camera ready. Scan the QR code.");
      } catch (error) {
        console.error("Camera start failed", error);
        startButton.disabled = false;
        setStatus(
          "Unable to open the camera. In iPhone Settings, allow Camera for Chrome, then try again. Details: " +
          (error.message || error),
          "error"
        );
      }
    });

    window.addEventListener("beforeunload", stopScanner);
  </script>
</body>
</html>
