<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HYROX QR Scanner</title>
  
  <!-- This line forces the app to load from your uploaded repository file -->
  <script src="html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f5f5; color: #111; font-family: Arial, sans-serif; }
    main { max-width: 480px; margin: 0 auto; padding: 24px 18px; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); padding: 20px; }
    h1 { font-size: 23px; margin: 0 0 10px; }
    p { line-height: 1.45; }
    button { width: 100%; border: 0; border-radius: 8px; padding: 14px; background: #111; color: #fff; cursor: pointer; font-size: 16px; font-weight: bold; }
    button:disabled { background: #888; cursor: not-allowed; }
    #reader { margin-top: 18px; overflow: hidden; border-radius: 8px; }
    #status { min-height: 24px; margin: 14px 0 0; font-weight: bold; }
    .error { color: #b42318; }
    .success { color: #18753a; }
  </style>
</head>


<body>
  <main>
    <div class="card">
      <h1>HYROX Volunteer QR Scan</h1>
      <p>Point the rear camera at the volunteer's QR code. The Volunteer ID will be sent back to the check-in page automatically.</p>

      <button id="startButton" type="button">Start Camera</button>
      <div id="reader"></div>
      <div id="status" aria-live="polite"></div>
    </div>
  </main>

  <script>
    // HARDCODED FIX: Paste your exact app URL directly here so parameters can't break it
    const CHECKIN_WEB_APP_URL = "https://google.com";
    
    const statusElement = document.getElementById("status");
    const startButton = document.getElementById("startButton");
    let scanner = null;
    let scanAccepted = false;

    function setStatus(message, type) {
      statusElement.textContent = message;
      statusElement.className = type || "";
    }

    async function stopScanner() {
      if (!scanner) return;
      try {
        if (scanner.isScanning) {
          await scanner.stop();
        }
      } catch (error) {
        console.warn("Camera shut down cleanly:", error);
      } finally {
        try {
          scanner.clear();
        } catch(e) {}
        scanner = null;
      }
    }

    async function onScanSuccess(decodedText) {
      if (scanAccepted) return;
      scanAccepted = true;

      const volunteerId = decodedText.trim();
      await stopScanner();

      const opener = window.opener;
      const hasOpener = !!(opener && !opener.closed);

      if (hasOpener) {
        try {
          // Send data back using cross-window message routing natively [1]
          opener.postMessage(
            { type: "hyroxVolunteerScan", volunteerId: volunteerId },
            "*"
          );
          setStatus("Scanned! Transferring to your check-in portal...", "success");
          window.setTimeout(() => window.close(), 500);
          return;
        } catch (error) {
          console.warn("PostMessage failed, falling back to direct web redirect", error);
        }
      }

      // Safe Fallback: If mobile browser sandboxing breaks window.opener, redirect directly
      setStatus("Redirecting to volunteer record...", "success");
      const separator = CHECKIN_WEB_APP_URL.includes("?") ? "&" : "?";
      window.location.replace(CHECKIN_WEB_APP_URL + separator + "volunteerId=" + encodeURIComponent(volunteerId));
    }

startButton.addEventListener("click", async function() {
  if (!window.Html5Qrcode) {
    setStatus("The scanning script library failed to download. Check connection profiles.", "error");
    return;
  }

  startButton.disabled = true;
  setStatus("Initializing camera...");
  scanAccepted = false;

  await stopScanner();
  document.getElementById("reader").innerHTML = "";

  try {
    // FIXED: Initializing engine with default parameters to eliminate configuration variable definition crashes
    scanner = new Html5Qrcode("reader");

    const cameras = await Html5Qrcode.getCameras();
    if (!cameras || cameras.length === 0) {
      throw new Error("No hardware video capture devices discovered on this computer build.");
    }

    // Try to find a phone/tablet rear camera first
    let selectedCamera = cameras.find(camera =>
      /(back|rear|environment|surface)/i.test(camera.label || "")
    );

    // Desktop mode check: if no environment lens string is matched, default to the active option
    if (!selectedCamera) {
      console.log("Defaulting to standard system camera hardware layout.");
      selectedCamera = cameras[0];
    }

    await scanner.start(
      selectedCamera.id,
      { 
        fps: 15, 
        qrbox: function(viewfinderWidth, viewfinderHeight) {
          const dimension = Math.min(viewfinderWidth, viewfinderHeight) * 0.65;
          return { width: Math.max(dimension, 200), height: Math.max(dimension, 200) };
        }, 
        aspectRatio: 1 
      },
      onScanSuccess,
      function() {}
    );
    setStatus("Camera running live. Hold up your volunteer badge code to the webcam lens.", "success");
  } catch (error) {
    console.error("Hardware streaming fault exception detail trace:", error);
    startButton.disabled = false;
    
    setStatus(
      "Webcam initialization failed. Verify your camera is plugged in. Details: " + 
      (error.message || error), 
      "error"
    );
  }
});



    window.addEventListener("beforeunload", stopScanner);
  </script>
</body>
</html>
